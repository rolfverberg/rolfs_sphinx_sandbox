name: Deploy Sphinx Docs to GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  delete_all_caches:
    runs-on: ubuntu-latest
    steps:
    - name: Clear all caches
      uses: easimon/wipe-cache@main
      with:
        # dry-run: 'true' can be used for testing before actual deletion
        dry-run: 'false'
  build_and_deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10.19
        uses: actions/setup-python@v5
        with:
          python-version: '3.10.19'

      - name: Display Python version
        run: python -c "import sys; print(sys.version)"

      - name: Install package
        run: |
          grep version setup.py
          python -m pip install --upgrade pip
          pip install -e .
          conda list

      - name: Install dependencies
        run: |
          pip install -r sphinx_requirements.txt
          pip install -r requirements.txt
          # hexrd not available over pip, needs hexrd channel
          conda config --add channels conda-forge
          conda config --append channels hexrd
          conda config --show channels
          conda list
          conda install -c hexrd==0.9.11 -c conda-forge hexrd
          conda config --remove channels hexrd
          # tomopy conflicts over pip
          conda config --show channels
          conda list
          conda install tomopy


      - name: Generate .rst files with sphinx-apidoc
        run: sphinx-apidoc --tocfile api_documentation -o docs src

      - name: Build Sphinx HTML documentation
        run: |
          make clean
          make html
        working-directory: ./docs

      - name: List generated files
        run: |
          pwd
          ls -lha
          find ./docs/_build/html -type f

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/_build/html
