name: Deploy Sphinx Docs to GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  delete_all_caches:
    runs-on: ubuntu-latest
    steps:
    - name: Clear all caches
      uses: easimon/wipe-cache@main
      with:
        # dry-run: 'true' can be used for testing before actual deletion
        dry-run: 'false'
  build_and_deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: '3.10'
          environment-file: 'environment.yml'
          auto-activate-base: 'false'
          auto-activate-environment: sphinx
          conda-remove-defaults: 'true'
          use-mamba: 'true'

      - name: Display Python version
        run: |
          conda list
          conda env list
          python --version
          python -c "import sys; print(sys.version)"

      - name: Install dependencies
        run: |
          conda activate sphinx
          python --version
          python -c "import sys; print(sys.version)"
          conda list
          python -m pip install --upgrade pip
          pip install sphinx
          pip install sphinx-math-dollar
          pip install sphinx-rtd-theme
          pip install myst-parser

      - name: Install package
        run: |
          grep version setup.py
          pip install -e .
          conda list
          python -c "import sys; print(sys.version)"

      - name: Generate .rst files with sphinx-apidoc
        run: |
          conda init
          conda activate sphinx
          sphinx-apidoc --tocfile api_documentation -o docs src

      - name: Build Sphinx HTML documentation
        run: |
          make clean
          make html
        working-directory: ./docs

      - name: List generated files
        shell: bash -l {0}
        run: |
          pwd
          ls -lha
          find ./docs/_build/html -type f

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/_build/html
