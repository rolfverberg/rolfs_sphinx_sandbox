name: "Deploy Sphinx with autodoc2"

on:
  push:
    branches: ["main"] # Trigger on pushes to main
  workflow_dispatch:   # Allows manual triggers

jobs:
  pages:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
    - uses: actions/checkout@v3
#    - name: Update docs configuration with version (tag) name
#      run: |
#        sed -i "s/PACKAGE_VERSION/${{ github.ref_name }}/" docs/conf.py
#        sed -i "s/PACKAGE_VERSION/${{ github.ref_name }}/" docs/installation.md
    - name: Build and deploy docs
      id: deployment
      uses: sphinx-notes/pages@v3
      with:
        checkout: false

