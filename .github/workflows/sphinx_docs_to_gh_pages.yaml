name: Deploy Sphinx Docs to GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install sphinx
          pip install myst-parser # Allow adding Markdown (.md) files
          pip install sphinx-rtd-theme # Read the Docs theme
          pip install -r requirements.txt

      - name: Install package
        run: pip install -e .

      - name: Generate .rst files with sphinx-apidoc
        run: sphinx-apidoc --tocfile api_documentation -o docs src

      - name: Build Sphinx HTML documentation
        run: |
          make clean
          make html
        working-directory: ./docs

#      - name: List generated files
#        run: |
#          pwd
#          ls -lha
#          find ./docs/_build/html -type f

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/_build/html # The directory where Sphinx outputted the HTML files
          # Note: The 'gh-pages' branch will be created automatically if it doesn't exist.

