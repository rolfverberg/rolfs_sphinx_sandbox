name: Deploy Sphinx Docs to GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  delete_all_caches:
    runs-on: ubuntu-latest
    steps:
    - name: Clear all caches
      uses: easimon/wipe-cache@main
      with:
        # dry-run: 'true' can be used for testing before actual deletion
        dry-run: 'false'
  build_and_deploy:
    runs-on: ubuntu-latest
    #strategy:
    #  matrix:
    #    python-version: ["3.10"] # Or use a range like "3.8 - 3.12"
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10 #${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' #${{ matrix.python-version }}

      - name: Display Python version
        run: |
          conda list | grep python
          python -c "import sys; print(sys.version)"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -c "import sys; print(sys.version)"
          pip install -r sphinx_requirements.txt
          #python -c "import sys; print(sys.version)"
          #pip install -r requirements.txt
          # hexrd not available over pip, needs hexrd channel
          conda config --show channels
          conda install -c conda-forge python=3.10
          conda install -c hexrd -c conda-forge hexrd
          # tomopy conflicts over pip
          conda install tomopy

      - name: Install package
        run: |
          grep version setup.py
          pip install -e .
          conda list
          python -c "import sys; print(sys.version)"

      - name: Generate .rst files with sphinx-apidoc
        run: sphinx-apidoc --tocfile api_documentation -o docs src

      - name: Build Sphinx HTML documentation
        run: |
          make clean
          make html
        working-directory: ./docs

      - name: List generated files
        run: |
          pwd
          ls -lha
          find ./docs/_build/html -type f

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/_build/html
