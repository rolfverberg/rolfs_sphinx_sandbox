name: Deploy Sphinx Docs to GitHub Pages

on:
  push:
    branches:
      - main # or master

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Grants write permissions to the job
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install sphinx # Install all necessary sphinx packages
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Generate .rst files with sphinx-apidoc
        run: sphinx-apidoc -o docs src/

      - name: Build Sphinx HTML documentation
        run: |
          cd docs
          make html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/build/html # The directory where Sphinx outputted the HTML files
          # Note: The 'gh-pages' branch will be created automatically if it doesn't exist.

