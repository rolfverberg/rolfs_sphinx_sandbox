name: Deploy Sphinx Docs to GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  delete_all_caches:
    runs-on: ubuntu-latest
    steps:
    - name: Clear all caches
      uses: easimon/wipe-cache@main
      with:
        # dry-run: 'true' can be used for testing before actual deletion
        dry-run: 'false'
  build_and_deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: 3.10
          environment-file: environment_3.10.19.yml
          auto-activate-base: false
          use-mamba: true

      - name: Display Python version
        run: |
          conda list | grep python
          python -c "import sys; print(sys.version)"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -c "import sys; print(sys.version)"
          pip install -r sphinx_requirements.txt

      - name: Install package
        run: |
          grep version setup.py
          pip install -e .
          conda list
          python -c "import sys; print(sys.version)"

      - name: Generate .rst files with sphinx-apidoc
        run: sphinx-apidoc --tocfile api_documentation -o docs src

      - name: Build Sphinx HTML documentation
        run: |
          make clean
          make html
        working-directory: ./docs

      - name: List generated files
        run: |
          pwd
          ls -lha
          find ./docs/_build/html -type f

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/_build/html
